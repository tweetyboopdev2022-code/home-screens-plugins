# Builds every plugin and attaches one <id>.tgz per plugin to a GitHub release.
# Each package holds <id>/manifest.json and <id>/dist/, the layout Home Screens installs from a URL.
name: Release plugins

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v1.0.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build and package
        run: |
          mkdir -p pkg stage
          for d in plugins/*/; do
            id=$(node -p "require('./$d/manifest.json').id")
            (cd "$d" && if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run build)
            mkdir -p "stage/$id"
            cp "$d/manifest.json" "stage/$id/"
            cp -r "$d/dist" "stage/$id/dist"
            tar -C stage --owner=0 --group=0 -czf "pkg/$id.tgz" "$id"
          done
          ls -l pkg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" pkg/*.tgz --target "$GITHUB_SHA" --title "Home Screens plugins $TAG" \
            --notes "Install a plugin from the Home Screens editor: Plugins → Install from URL, then paste the link to its .tgz below. Run the setup wizard first (https://tweetyboopdev2022-code.github.io/home-screens-plugins/) to put your own family's names in the defaults."
